<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  $(function() {
    /* in-page scrolling is handled below (offset for the sticky masthead) */
    $("a").unbind("click.smoothscroll");

    /* shrink the masthead after scrolling down */
    var $masthead = $(".masthead");
    var updateMasthead = function() {
      var y = $(window).scrollTop();
      if (y > 40) {
        $masthead.addClass("masthead--compact");
      } else if (y < 10) {
        $masthead.removeClass("masthead--compact");
      }
    };
    $(window).on("scroll", updateMasthead);
    updateMasthead();

    /* place in-page link targets right below the sticky masthead */
    $(document).on("click", 'a[href*="#"]', function(e) {
      var samePage = this.hostname === location.hostname &&
        this.pathname.replace(/^\//, "") === location.pathname.replace(/^\//, "");
      var $target = this.hash && $(this.hash);
      if (!samePage || !$target || !$target.length) return;

      e.preventDefault();
      /* switch to the compact masthead without animation so its final height can be measured */
      var $animated = $masthead.find(".masthead__inner-wrap, .greedy-nav a");
      $animated.css("transition", "none");
      $masthead.addClass("masthead--compact");
      var top = $target.offset().top - $masthead.outerHeight() - 12;
      $("html, body").stop().animate({ scrollTop: Math.max(top, 0) }, 400);
      setTimeout(function() { $animated.css("transition", ""); }, 0);
      if (history.pushState) history.pushState(null, "", this.hash);
    });
  });
</script>
